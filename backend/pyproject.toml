[project]
name = "privacy-guardian"
version = "0.5.0"
description = "Privacy Guardian Agent v2 - PII detection with a LangGraph agent graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.164",  # max_body_size (request body limit)
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "langgraph>=1.2,<2",
    "pypdf>=5",
    "python-docx>=1.1",
    "cryptography>=43",
    "sqlalchemy>=2.0.40,<3",
    "alembic>=1.14,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "bcrypt>=4.2,<6",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
ml = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
