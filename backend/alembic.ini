# Migrations for DATA_DIR/app.db. Run from backend/:  alembic upgrade head
# The database location comes from DATA_DIR (env), never from this file.
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
