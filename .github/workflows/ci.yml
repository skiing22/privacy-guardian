name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"   # no PyTorch: the core job runs without the ML extra
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: python scripts/check_layers.py
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -e "../backend[dev]"
      - name: API types match the backend schema
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t privacy-guardian .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name pg -p 8000:8000 privacy-guardian
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/scans | grep -q "<title>Privacy Guardian</title>"
          docker rm -f pg
