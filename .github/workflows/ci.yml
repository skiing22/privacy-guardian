name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"   # no PyTorch: the core job runs without the ML extra
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: python scripts/check_layers.py
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -e "../backend[dev]"
      - name: API types match the backend schema
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Browser journeys (ARCHITECTURE 15) against the real app with a fixed name finder, so
    # review always pauses the same way. The image itself is checked by the docker job.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      # A fresh data folder each run: the tamper step breaks the log on purpose.
      - name: Start the app
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: e2e-admin-password   # test-only account in a throwaway database
        run: |
          mkdir -p "$RUNNER_TEMP/e2edata"
          python e2e/server.py "$RUNNER_TEMP/e2edata" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - run: npx playwright test
        working-directory: e2e
        env: { E2E_DB: "${{ runner.temp }}/e2edata/app.db" }
      - name: No test values in the server log
        run: |
          if grep -E 'Rahul Sharma|Priya|Nehru Nagar|98470' "$RUNNER_TEMP/server.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Tiny random model: the private weights never reach pull request builds (API 8.2).
      - run: docker build --build-arg MODEL_SOURCE=fake -t privacy-guardian .
      - name: Image holds no secrets
        run: |
          docker run --rm --entrypoint sh privacy-guardian -c '
            test ! -e /app/.env && test ! -e /run/secrets/hf_token &&
            ! env | grep -qi "hf_token\|PG_.*_KEY=." &&
            test "$(cat /app/model/VERSION)" = fake-ci-model &&
            test "$(id -u)" = 10001 && ! touch /app/model/x 2>/dev/null'
          ! docker history --no-trunc privacy-guardian | grep -qi "hf_[a-z0-9]\{20,\}"
      - name: Container loads the model and cleans a document
        run: |
          docker run -d --name pg -p 8000:8000 \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-password-123 \
            privacy-guardian
          bash scripts/smoke.sh http://localhost:8000 ci@example.com ci-password-123 \
            || { docker logs pg; exit 1; }
          curl -sf localhost:8000/scans | grep -q "<title>Privacy Guardian</title>"
          docker rm -f pg

  # The real model, only on main and only when the repo owner has set it up
  # (Settings > Secrets: HF_TOKEN; Variables: MODEL_REPO, MODEL_REVISION, MODEL_SHA256).
  docker-real-model:
    if: github.ref == 'refs/heads/main' && vars.MODEL_REPO != ''
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the private model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker build --secret id=hf_token,env=HF_TOKEN \
            --build-arg MODEL_REPO=${{ vars.MODEL_REPO }} \
            --build-arg MODEL_REVISION=${{ vars.MODEL_REVISION }} \
            --build-arg MODEL_SHA256=${{ vars.MODEL_SHA256 }} \
            -t privacy-guardian:real .
      - name: Token is not in the image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ! docker history --no-trunc privacy-guardian:real | grep -qF "$HF_TOKEN"
          ! docker save privacy-guardian:real | grep -aqF "$HF_TOKEN"
      - name: Real model loads and cleans a document
        run: |
          docker run -d --name pg -p 8000:8000 \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-password-123 \
            privacy-guardian:real
          bash scripts/smoke.sh http://localhost:8000 ci@example.com ci-password-123 \
            || { docker logs pg; exit 1; }
          docker rm -f pg
