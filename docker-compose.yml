# Local run of the production image (ARCHITECTURE 16.3): one container, one data volume.
# No database service: SQLite lives in the volume (D2).
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports: ["8000:8000"]
    volumes:
      - app-data:/data

volumes:
  app-data:
